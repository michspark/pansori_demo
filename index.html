<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Frame-Level Pansori Mode Classification</title>
  <style>
    :root {
      --bg: #faf8f5;
      --fg: #1f1d1a;
      --muted: #6b665e;
      --accent: #b23a2a;
      --border: #e4dfd6;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #161514;
        --fg: #ece8e1;
        --muted: #a39d93;
        --accent: #e0705f;
        --border: #2e2b28;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
      background: var(--bg);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      line-height: 1.5;
    }
    main {
      max-width: 40rem;
      text-align: center;
    }
    h1 {
      margin: 0 0 1.25rem;
      font-size: clamp(1.75rem, 5vw, 2.75rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.2;
    }
    .badge {
      display: inline-block;
      padding: 0.35rem 0.9rem;
      border: 1px solid var(--accent);
      border-radius: 999px;
      color: var(--accent);
      font-size: 0.9rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    footer {
      margin-top: 2.5rem;
      padding-top: 1rem;
      border-top: 1px solid var(--border);
      color: var(--muted);
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <main>
    <h1>Frame-Level Pansori Mode Classification</h1>
    <span class="badge">Work in Progress</span>
    <footer>Demo page &middot; coming soon</footer>
  </main>
</body>
</html>
